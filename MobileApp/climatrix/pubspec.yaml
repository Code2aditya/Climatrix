name: climatrix
description: "Smart Urban Heat & Climate Resilience Mobile Application with Glassmorphism UI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
